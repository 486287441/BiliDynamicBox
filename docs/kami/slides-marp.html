<h1 id="bilidynamicbox">BiliDynamicBox</h1>
<div class="sub">B 站动态 · 收件箱式视频流</div>
<div class="meta">Markdown 演示稿 · 2026.05</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1058.2677165354332 597.1653543307087"><foreignObject width="1058.2677165354332" height="597.1653543307087"><section id="2" data-paginate="true" data-footer="BiliDynamicBox" data-theme="kami" lang="zh-CN" data-marpit-pagination="2" style="--paginate:true;--footer:BiliDynamicBox;--theme:kami;" data-marpit-pagination-total="8">
<p><span class="eyebrow">01 · 问题</span></p>
<h2 id="%E5%8E%9F%E7%94%9F%E5%8A%A8%E6%80%81%E9%A1%B5%E8%AE%A9%E7%94%A8%E6%88%B7%E5%9C%A8%E6%B7%B7%E6%8E%92%E6%97%B6%E9%97%B4%E7%BA%BF%E9%87%8C%E5%81%9A%E8%A7%82%E7%9C%8B%E5%86%B3%E7%AD%96">原生动态页让用户在混排时间线里做观看决策</h2>
<p class="lead">视频、图片、文字同屏出现，扫读成本高；稍后再看与屏蔽分散在单条菜单里。</p>
<div class="c2">
<div>
<h3 id="%E5%B7%B2%E5%AE%9A%E7%9B%AE%E6%A0%87">已定目标</h3>
<ul>
<li>quick_filter：先降噪</li>
<li>仅 <code>t.bilibili.com</code></li>
<li>点击为主，toast 反馈</li>
</ul>
</div>
<div>
<h3 id="%E6%88%90%E5%8A%9F%E6%97%B6%E7%94%A8%E6%88%B7%E5%BE%97%E5%88%B0">成功时用户得到</h3>
<ul>
<li>稍后再看清单</li>
<li>不想看过滤可持续</li>
<li>按日分组处理更新</li>
</ul>
</div>
</div>
<footer>BiliDynamicBox</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1058.2677165354332 597.1653543307087"><foreignObject width="1058.2677165354332" height="597.1653543307087"><section id="3" data-paginate="true" data-footer="BiliDynamicBox" data-theme="kami" lang="zh-CN" data-marpit-pagination="3" style="--paginate:true;--footer:BiliDynamicBox;--theme:kami;" data-marpit-pagination-total="8">
<p><span class="eyebrow">02 · 产品</span></p>
<h2 id="%E6%94%B6%E4%BB%B6%E7%AE%B1%E5%8F%AA%E5%91%88%E7%8E%B0%E8%A7%86%E9%A2%91%E5%8A%A8%E6%80%81%E5%B9%B6%E6%8C%89%E4%BB%8A%E5%A4%A9--%E6%98%A8%E5%A4%A9--%E6%97%A5%E6%9C%9F%E5%88%86%E7%BB%84">收件箱只呈现视频动态，并按今天 / 昨天 / 日期分组</h2>
<table class="t2x2">
<tr>
<td>
<div class="mt"><span class="ml">想看</span></div>
<p>加入 B 站稍后再看；使用浏览器登录 Cookie，无需 API Key。</p>
</td>
<td>
<div class="mt"><span class="ml">不想看</span></div>
<p>移入垃圾箱；刷新后该条不再出现；顶部工具栏可恢复。</p>
</td>
</tr>
<tr>
<td>
<div class="mt"><span class="ml">范围</span></div>
<p>仅隐藏当前动态，不连带屏蔽该 UP 其它内容。</p>
</td>
<td>
<div class="mt"><span class="ml">取关</span></div>
<p>同一 UP 连续 5 次不想看 → 立刻弹窗确认。</p>
</td>
</tr>
</table>
<footer>BiliDynamicBox</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1058.2677165354332 597.1653543307087"><foreignObject width="1058.2677165354332" height="597.1653543307087"><section id="4" data-paginate="true" data-footer="BiliDynamicBox" data-theme="kami" lang="zh-CN" data-marpit-pagination="4" style="--paginate:true;--footer:BiliDynamicBox;--theme:kami;" data-marpit-pagination-total="8">
<p><span class="eyebrow">03 · 体验</span></p>
<h2 id="%E5%8F%82%E8%80%83-bewlybewly-%E5%8D%A1%E7%89%87%E6%89%AB%E8%AF%BB%E4%BD%86%E5%AE%9E%E7%8E%B0%E7%8B%AC%E7%AB%8B%E5%9C%A8%E6%9C%AC%E4%BB%93%E5%BA%93">参考 BewlyBewly 卡片扫读，但实现独立在本仓库</h2>
<p class="lead">中等卡片密度 balanced_default；垃圾箱 top_toolbar；想看后 toast_only。</p>
<div class="co">明确不做：首页 / 搜索改造、推荐算法、批量运营、键盘快捷键（当前）。</div>
<footer>BiliDynamicBox</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1058.2677165354332 597.1653543307087"><foreignObject width="1058.2677165354332" height="597.1653543307087"><section id="5" data-paginate="true" data-footer="BiliDynamicBox" data-theme="kami" lang="zh-CN" data-marpit-pagination="5" style="--paginate:true;--footer:BiliDynamicBox;--theme:kami;" data-marpit-pagination-total="8">
<p><span class="eyebrow">04 · 架构</span></p>
<h2 id="mv3-%E6%B3%A8%E5%85%A5--vue-3--pinia%E8%A7%84%E5%88%99%E6%94%B6%E6%95%9B%E5%9C%A8-domain-%E5%B1%82">MV3 注入 + Vue 3 + Pinia，规则收敛在 domain 层</h2>
<div class="c2">
<div>
<h3 id="%E5%B7%A5%E7%A8%8B%E7%BB%93%E6%9E%84">工程结构</h3>
<ul>
<li><code>content/</code> 页面替换与挂载</li>
<li><code>domain/</code> filter · group · rules</li>
<li><code>store/</code> inbox · decision · trash</li>
<li><code>services/</code> api · storage · toast</li>
</ul>
</div>
<div>
<h3 id="%E6%95%B0%E6%8D%AE%E4%B8%8E%E9%9A%90%E7%A7%81">数据与隐私</h3>
<ul>
<li><code>chrome.storage.local</code></li>
<li>同源 <code>credentials: include</code></li>
<li>不上传个人数据</li>
</ul>
</div>
</div>
<footer>BiliDynamicBox</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1058.2677165354332 597.1653543307087"><foreignObject width="1058.2677165354332" height="597.1653543307087"><section id="6" data-paginate="true" data-footer="BiliDynamicBox" data-theme="kami" lang="zh-CN" data-marpit-pagination="6" style="--paginate:true;--footer:BiliDynamicBox;--theme:kami;" data-marpit-pagination-total="8">
<p><span class="eyebrow">05 · 交付</span></p>
<h2 id="%E6%8C%89-m01%E2%80%93m05-%E6%A8%A1%E5%9D%97%E6%8E%A8%E8%BF%9B%E5%BD%93%E5%89%8D-v001-%E5%BC%80%E5%8F%91%E8%80%85%E6%A8%A1%E5%BC%8F%E5%8F%AF%E7%94%A8">按 M01–M05 模块推进，当前 v0.0.1 开发者模式可用</h2>
<table class="data">
<tr><td>M01</td><td>骨架与页面接管</td><td>注入 Vue 根</td></tr>
<tr><td>M02</td><td>视频过滤 + 日期分组</td><td>domain 层</td></tr>
<tr><td>M03</td><td>卡片与交互</td><td>想看 / 不想看</td></tr>
<tr><td>M04–M05</td><td>垃圾箱 + 取关阈值</td><td>持久化规则</td></tr>
</table>
<footer>BiliDynamicBox</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1058.2677165354332 597.1653543307087"><foreignObject width="1058.2677165354332" height="597.1653543307087"><section id="7" data-paginate="true" data-footer="BiliDynamicBox" data-theme="kami" lang="zh-CN" data-marpit-pagination="7" style="--paginate:true;--footer:BiliDynamicBox;--theme:kami;" data-marpit-pagination-total="8">
<p><span class="eyebrow">06 · 安装</span></p>
<h2 id="%E4%B8%89%E8%A1%8C%E5%91%BD%E4%BB%A4%E5%8D%B3%E5%8F%AF%E5%9C%A8%E6%9C%AC%E5%9C%B0%E5%8A%A0%E8%BD%BD%E6%9C%AA%E6%89%93%E5%8C%85%E6%89%A9%E5%B1%95">三行命令即可在本地加载未打包扩展</h2>
<pre><code class="language-bash">git <span class="hljs-built_in">clone</span> https://github.com/486287441/BiliDynamicBox.git
<span class="hljs-built_in">cd</span> BiliDynamicBox/extension &amp;&amp; npm ci &amp;&amp; npm run build
<span class="hljs-comment"># Chrome 扩展页 → 加载 extension/ 目录</span>
</code></pre>
<div class="co">登录 B 站 → 打开动态页 → 处理「今天」分组。</div>
<footer>BiliDynamicBox</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1058.2677165354332 597.1653543307087"><foreignObject width="1058.2677165354332" height="597.1653543307087"><section id="8" data-class="cover" data-theme="kami" lang="zh-CN" class="cover" style="--class:cover;--theme:kami;">
